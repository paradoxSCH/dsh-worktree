name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Verify committed distribution
        if: runner.os == 'Linux'
        shell: bash
        run: git diff --exit-code -- lib
      - run: pnpm run pack:check

  dsh-composition:
    name: DSH global Bundle composition
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: dsh-worktree
      - name: Checkout DSH child-cwd seam
        uses: actions/checkout@v4
        with:
          repository: paradoxSCH/deepseek-harness
          ref: feat/child-cwd-seam
          path: deepseek-harness
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: |
            dsh-worktree/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml
      - name: Build plugin distribution
        working-directory: dsh-worktree
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install DSH source dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Install Bundle into an isolated global profile
        working-directory: deepseek-harness
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-worktree-home
        run: pnpm dsh plugin --profile headless add "$GITHUB_WORKSPACE/dsh-worktree"
      - name: Mount the real profile
        working-directory: deepseek-harness
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-worktree-home
        shell: bash
        run: |
          set +e
          output=$(pnpm dsh --profile headless "composition smoke" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q 'MISSING_CREDENTIAL' <<<"$output"
          ! grep -q 'plugin tree failed to load' <<<"$output"
